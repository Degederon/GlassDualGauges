# Glass Dual Gauge examples
#
# A complete dashboard with eight example cards. It works as soon as you paste it:
# every card has `demo: true`, so it shows moving sample values.
#
# To use your own sensors on a card: change each `entity:` to one of yours, then
# delete the line `demo: true` from that card.
#
# The cards use their dark glass look (theme: dark) to suit the dark background,
# even when Home Assistant itself is in light mode.
#
# How to add it:
#   Settings → Dashboards → + Add dashboard → New dashboard from scratch → Create
#   Open the new dashboard → pencil (Edit dashboard) → ⋮ → Raw configuration editor
#   Select everything, paste this file, then Save.
#
# To use a single example on an existing dashboard instead, add a Glass Dual Gauge
# card, select "Show code editor", and paste just that card (starting at
# "type: custom:glass-dual-gauge", without the leading "- ").

title: Gauge examples
views:
  - title: Examples
    path: examples
    icon: mdi:gauge
    type: sections
    max_columns: 3
    # The aurora wallpaper gives the frosted glass colour to blur. To use your own picture,
    # put it in your config/www folder and change the address to /local/your-picture.jpg
    background: "center / cover no-repeat fixed url('https://raw.githubusercontent.com/Degederon/GlassDualGauges/main/wallpapers/aurora.jpg'), #0a0d1c"
    sections:
      # Gradient colours, plus zones and a marker on a full circle.
      - type: grid
        cards:
          - type: custom:glass-heading
            heading: Colour ranges
            subtitle: Gradients, zones and a marker
            icon: mdi:palette
            color: "#7b8cff"
            theme: dark
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Office
            gauges:
            - entity: sensor.office_temperature
              name: Temperature
              unit: "°C"
              min: 0
              max: 40
              color_mode: gradient
              colors:
              - from: 0
                color: '#6cb6ff'
              - from: 18
                color: '#38d6a0'
              - from: 26
                color: '#ffc857'
              - from: 30
                color: '#ff5c7a'
            - entity: sensor.office_humidity
              name: Humidity
              unit: "%"
              min: 0
              max: 100
              colors:
              - from: 0
                color: '#ffc857'
              - from: 35
                color: '#38d6a0'
              - from: 65
                color: '#6cb6ff'
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Air quality
            arc: 360
            primary: outer
            gauges:
            - entity: sensor.air_quality_index
              name: IAQ
              unit: IAQ
              min: 0
              max: 300
            - entity: sensor.co2
              name: CO₂
              unit: ppm
              min: 400
              max: 2500
              decimals: 0
              zones:
              - from: 400
                to: 1000
                color: '#38d6a0'
              - from: 1000
                to: 1600
                color: '#ffc857'
              - from: 1600
                to: 2500
                color: '#ff5c7a'
              markers:
              - value: 1000
                label: '1000'
                color: '#ffc857'
      # Rings that fill from zero, and a half-circle tank with level markers.
      - type: grid
        cards:
          - type: custom:glass-heading
            heading: Negative values and half circles
            subtitle: Power flowing both ways, and a tank with level marks
            icon: mdi:swap-horizontal
            color: "#22d3c5"
            theme: dark
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Energy
            arc: 240
            primary: outer
            gauges:
            - entity: sensor.battery_power
              name: Battery
              unit: W
              min: -3000
              max: 3000
              bidirectional: true
              decimals: 0
              colors:
              - from: -3000
                color: '#ff9f5c'
              - from: 0
                color: '#38d6a0'
            - entity: sensor.grid_power
              name: Grid
              unit: W
              min: -5000
              max: 5000
              bidirectional: true
              decimals: 0
              colors:
              - from: -5000
                color: '#38d6a0'
              - from: 0
                color: '#7b8cff'
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Water tank
            arc: 180
            gauges:
            - entity: sensor.tank_temperature
              name: Temperature
              unit: "°C"
              min: 0
              max: 30
              color: '#6cb6ff'
            - entity: sensor.tank_level
              name: Level
              unit: L
              min: 0
              max: 3000
              decimals: 0
              colors:
              - from: 0
                color: '#ff5c7a'
              - from: 750
                color: '#ffc857'
              - from: 1500
                color: '#38d6a0'
              markers:
              - value: 1000
                label: ⅓
              - value: 2000
                label: ⅔
      # Liquid, Butterfly, Spiral and Capsules with real-world settings.
      - type: grid
        cards:
          - type: custom:glass-heading
            heading: Other styles
            subtitle: Liquid, Butterfly, Spiral and Capsules
            icon: mdi:shape
            color: "#ff5fa2"
            theme: dark
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Rain tank
            style: liquid
            gauges:
            - entity: sensor.tank_level_percent
              name: Level
              unit: "%"
              min: 0
              max: 100
              color: '#6cb6ff'
            - entity: sensor.tank_temperature
              name: Temperature
              unit: "°C"
              min: 0
              max: 30
              color: '#38d6a0'
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Temperature
            style: butterfly
            gauges:
            - entity: sensor.living_room_temperature
              name: Inside
              unit: "°C"
              min: -10
              max: 40
              color: '#ff9f5c'
            - entity: sensor.outdoor_temperature
              name: Outside
              unit: "°C"
              min: -10
              max: 40
              color: '#6cb6ff'
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Today
            style: spiral
            primary: outer
            gauges:
            - entity: sensor.active_minutes
              name: Active
              unit: min
              min: 0
              max: 60
              color: '#ffc857'
            - entity: sensor.steps_today
              name: Steps
              unit: steps
              min: 0
              max: 10000
              decimals: 0
              color: '#22d3c5'
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Aquarium
            style: capsules
            gauges:
            - entity: sensor.aquarium_temperature
              name: Water
              unit: "°C"
              min: 18
              max: 32
              color: '#38d6a0'
            - entity: sensor.aquarium_ph
              name: pH
              unit: pH
              min: 6
              max: 9
              decimals: 1
              color: '#c86bff'
