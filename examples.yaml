# Glass Dual Gauge examples. Each block is one card.

# Room climate: temperature (inner, big) and humidity (outer)
type: custom:glass-dual-gauge
name: Office
gauges:
  - entity: sensor.office_temperature
    name: Temperature
    min: 0
    max: 40
    color_mode: gradient
    colors:
      - from: 0
        color: "#6cb6ff"
      - from: 18
        color: "#38d6a0"
      - from: 26
        color: "#ffc857"
      - from: 30
        color: "#ff5c7a"
  - entity: sensor.office_humidity
    name: Humidity
    min: 0
    max: 100
    colors:
      - from: 0
        color: "#ffc857"
      - from: 35
        color: "#38d6a0"
      - from: 65
        color: "#6cb6ff"
---
# Air quality: full circle, CO2 on the outer ring shown large, with zones and a marker
type: custom:glass-dual-gauge
name: Air quality
arc: 360
primary: outer
gauges:
  - entity: sensor.air_quality_index
    name: IAQ
    min: 0
    max: 300
  - entity: sensor.co2
    name: CO₂
    min: 400
    max: 2500
    decimals: 0
    zones:
      - from: 400
        to: 1000
        color: "#38d6a0"
      - from: 1000
        to: 1600
        color: "#ffc857"
      - from: 1600
        to: 2500
        color: "#ff5c7a"
    markers:
      - value: 1000
        label: "1000"
        color: "#ffc857"
---
# Energy: both rings fill from zero, so imports and exports read at a glance
type: custom:glass-dual-gauge
name: Energy
arc: 240
primary: outer
gauges:
  - entity: sensor.battery_power
    name: Battery
    min: -3000
    max: 3000
    bidirectional: true
    decimals: 0
    colors:
      - from: -3000
        color: "#ff9f5c"
      - from: 0
        color: "#38d6a0"
  - entity: sensor.grid_power
    name: Grid
    min: -5000
    max: 5000
    bidirectional: true
    decimals: 0
    colors:
      - from: -5000
        color: "#38d6a0"
      - from: 0
        color: "#7b8cff"
---
# Water tank: half circle with level markers
type: custom:glass-dual-gauge
name: Water tank
arc: 180
gauges:
  - entity: sensor.tank_temperature
    name: Temperature
    min: 0
    max: 30
    color: "#6cb6ff"
  - entity: sensor.tank_level
    name: Level
    min: 0
    max: 3000
    decimals: 0
    colors:
      - from: 0
        color: "#ff5c7a"
      - from: 750
        color: "#ffc857"
      - from: 1500
        color: "#38d6a0"
    markers:
      - value: 1000
        label: "⅓"
      - value: 2000
        label: "⅔"
---
# Liquid: tank level fills the bowl, temperature on the arc
type: custom:glass-dual-gauge
name: Rain tank
style: liquid
gauges:
  - entity: sensor.tank_level_percent
    name: Level
    min: 0
    max: 100
    color: "#6cb6ff"
  - entity: sensor.tank_temperature
    name: Temperature
    min: 0
    max: 30
    color: "#38d6a0"
---
# Butterfly: inside vs outside temperature
type: custom:glass-dual-gauge
name: Temperature
style: butterfly
gauges:
  - entity: sensor.living_room_temperature
    name: Inside
    min: -10
    max: 40
    color: "#ff9f5c"
  - entity: sensor.outdoor_temperature
    name: Outside
    min: -10
    max: 40
    color: "#6cb6ff"
---
# Spiral: steps keep winding past the daily goal
type: custom:glass-dual-gauge
name: Today
style: spiral
primary: outer
gauges:
  - entity: sensor.active_minutes
    name: Active
    min: 0
    max: 60
    color: "#ffc857"
  - entity: sensor.steps_today
    name: Steps
    min: 0
    max: 10000
    decimals: 0
    color: "#22d3c5"
---
# Capsules: two values with different units
type: custom:glass-dual-gauge
name: Aquarium
style: capsules
gauges:
  - entity: sensor.aquarium_temperature
    name: Water
    min: 18
    max: 32
    color: "#38d6a0"
  - entity: sensor.aquarium_ph
    name: pH
    min: 6
    max: 9
    decimals: 1
    color: "#c86bff"
