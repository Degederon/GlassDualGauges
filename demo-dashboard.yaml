# Glass Dual Gauge demo dashboard
#
# Shows all 13 styles with moving sample values. No sensors needed: every card
# uses `demo: true`. To use your own sensors, edit a card, remove `demo: true`
# and pick an entity for each value.
#
# The cards use their dark glass look (theme: dark) to suit the dark background,
# even when Home Assistant itself is in light mode.
#
# How to add it:
#   Settings → Dashboards → + Add dashboard → New dashboard from scratch
#   Open the new dashboard → pencil (Edit dashboard) → ⋮ → Raw configuration editor
#   Replace everything with this file, then Save.

title: Gauge demo
views:
  - title: Gauges
    path: gauges
    icon: mdi:gauge
    type: sections
    max_columns: 4
    # The aurora wallpaper gives the frosted glass colour to blur. To use your own picture,
    # put it in your config/www folder and change the address to /local/your-picture.jpg
    background: "center / cover no-repeat fixed url('https://raw.githubusercontent.com/Degederon/GlassDualGauges/main/wallpapers/aurora.jpg'), #0a0d1c"
    sections:
      - type: grid
        cards:
          - type: custom:glass-heading
            heading: Climate
            subtitle: Temperature, humidity and air
            icon: mdi:home-thermometer
            color: "#ff9f5c"
            theme: dark
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Living room
            style: rings
            gauges:
              - name: Temperature
                unit: "°C"
                min: 0
                max: 40
                color_mode: gradient
                colors:
                  - from: 0
                    color: "#6cb6ff"
                  - from: 18
                    color: "#38d6a0"
                  - from: 26
                    color: "#ffc857"
                  - from: 30
                    color: "#ff5c7a"
              - name: Humidity
                unit: "%"
                min: 0
                max: 100
                color: "#7b8cff"
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Inside and out
            style: butterfly
            gauges:
              - name: Inside
                unit: "°C"
                min: -10
                max: 40
                color: "#ff9f5c"
              - name: Outside
                unit: "°C"
                min: -10
                max: 40
                color: "#6cb6ff"
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Air quality
            style: segments
            primary: outer
            gauges:
              - name: Air quality
                unit: IAQ
                min: 0
                max: 200
                decimals: 0
                color: "#c86bff"
              - name: CO₂
                unit: ppm
                min: 400
                max: 2000
                decimals: 0
                color_mode: gradient
                colors:
                  - from: 400
                    color: "#38d6a0"
                  - from: 1000
                    color: "#ffc857"
                  - from: 1600
                    color: "#ff5c7a"
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Thermostat
            style: needles
            gauges:
              - name: Current
                unit: "°C"
                min: 10
                max: 30
                color: "#ff9f5c"
              - name: Target
                unit: "°C"
                min: 10
                max: 30
                color: "#38d6a0"

      - type: grid
        cards:
          - type: custom:glass-heading
            heading: Energy
            subtitle: Solar, battery and the house
            icon: mdi:lightning-bolt
            color: "#ffc857"
            theme: dark
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Solar
            style: pulse
            primary: outer
            gauges:
              - name: Usage
                unit: kW
                min: 0
                max: 5
                color: "#ff9f5c"
              - name: Solar
                unit: kW
                min: 0
                max: 6
                color: "#ffc857"
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Battery and grid
            style: rings
            arc: 240
            primary: outer
            gauges:
              - name: Battery
                unit: W
                min: -3000
                max: 3000
                decimals: 0
                bidirectional: true
                colors:
                  - from: -3000
                    color: "#ff9f5c"
                  - from: 0
                    color: "#38d6a0"
              - name: Grid
                unit: W
                min: -5000
                max: 5000
                decimals: 0
                bidirectional: true
                colors:
                  - from: -5000
                    color: "#38d6a0"
                  - from: 0
                    color: "#7b8cff"
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Power
            style: tape
            gauges:
              - name: Battery
                unit: "%"
                min: 0
                max: 100
                decimals: 0
                color: "#38d6a0"
              - name: House load
                unit: W
                min: 0
                max: 6000
                decimals: 0
                color: "#7b8cff"
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Server
            style: orbit
            gauges:
              - name: CPU
                unit: "%"
                min: 0
                max: 100
                color: "#22d3c5"
              - name: Memory
                unit: "%"
                min: 0
                max: 100
                color: "#c86bff"

      - type: grid
        cards:
          - type: custom:glass-heading
            heading: Water and garden
            subtitle: Tanks, fish and plants
            icon: mdi:water
            color: "#6cb6ff"
            theme: dark
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Rain tank
            style: liquid
            gauges:
              - name: Level
                unit: "%"
                min: 0
                max: 100
                color: "#6cb6ff"
              - name: Water
                unit: "°C"
                min: 0
                max: 30
                color: "#38d6a0"
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Aquarium
            style: capsules
            gauges:
              - name: Water
                unit: "°C"
                min: 18
                max: 32
                color: "#38d6a0"
              - name: pH
                unit: pH
                min: 6
                max: 9
                decimals: 1
                color: "#c86bff"
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Garden
            style: dots
            gauges:
              - name: Soil moisture
                unit: "%"
                min: 0
                max: 100
                decimals: 0
                color: "#38d6a0"
              - name: Sunlight
                unit: "%"
                min: 0
                max: 100
                decimals: 0
                color: "#ffc857"

      - type: grid
        cards:
          - type: custom:glass-heading
            heading: Me and the sky
            subtitle: Steps, sleep and the moon
            icon: mdi:weather-night
            color: "#c86bff"
            theme: dark
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Today
            style: spiral
            primary: outer
            gauges:
              - name: Active
                unit: min
                min: 0
                max: 60
                decimals: 0
                color: "#ffc857"
              - name: Steps
                unit: steps
                min: 0
                max: 10000
                decimals: 0
                color: "#22d3c5"
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Wellbeing
            style: bloom
            gauges:
              - name: Sleep
                unit: h
                min: 0
                max: 9
                color: "#c86bff"
              - name: Resting HR
                unit: bpm
                min: 40
                max: 100
                decimals: 0
                color: "#ff5fa2"
          - type: custom:glass-dual-gauge
            demo: true
            theme: dark
            name: Tonight
            style: moon
            gauges:
              - name: Moon lit
                unit: "%"
                min: 0
                max: 100
                decimals: 0
                color: "#ffe08a"
              - name: Cloud cover
                unit: "%"
                min: 0
                max: 100
                decimals: 0
                color: "#7b8cff"
